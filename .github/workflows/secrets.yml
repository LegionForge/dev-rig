# Reusable workflow: gitleaks secret scanning (language-agnostic)
# Runs gitleaks CLI directly — avoids the license requirement added in gitleaks-action@v2.
#
# Caller syntax:
#
#   jobs:
#     secrets:
#       uses: LegionForge/dev-rig/.github/workflows/secrets.yml@main

name: Secret Scanning

permissions:
  contents: read

concurrency:
  group: dev-rig-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks CLI version to install"
        required: false
        type: string
        default: "8.24.0"

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0    # full history — gitleaks scans all commits, not just HEAD
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          VERSION="$GITLEAKS_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid gitleaks version"; exit 2; }
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan
        run: gitleaks detect --source . --log-opts="--all" --verbose
