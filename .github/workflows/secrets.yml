# Backward-compatibility shim — canonical path is common/secrets.yml
# Existing callers continue to work unchanged.
# New projects should use:
#   uses: LegionForge/dev-rig/.github/workflows/common/secrets.yml@main

name: Secret Scanning

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks CLI version to install"
        required: false
        type: string
        default: "8.24.0"

jobs:
  secrets:
    uses: LegionForge/dev-rig/.github/workflows/common/secrets.yml@main
    with:
      gitleaks-version: ${{ inputs.gitleaks-version }}
