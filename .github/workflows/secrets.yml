# Reusable workflow: gitleaks secret scanning (OWASP SAMM — Implementation/Secure Build)
# Caller syntax:
#
#   jobs:
#     secrets:
#       uses: LegionForge/dev-rig/.github/workflows/secrets.yml@main
#       permissions:
#         contents: read   # required by gitleaks-action

name: Secret Scanning

on:
  workflow_call:

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history — gitleaks scans all commits, not just HEAD

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: GITLEAKS_LICENSE for private repos (not needed for public OSS)
