# Reusable workflow: tests + coverage enforcement (Node/TypeScript)
#
# Works with vitest, jest, or any runner that exits non-zero on coverage failure.
# Coverage threshold is enforced by the project's own runner config:
#   vitest.config.ts → coverage.thresholds
#   jest.config      → coverageThreshold
# The threshold input is passed as COVERAGE_THRESHOLD env var for configs that read it.
#
# Standard LegionForge npm script expected:
#   "test:coverage": "vitest run --coverage"   (vitest)
#   "test:coverage": "jest --coverage"         (jest)
#
# Caller syntax:
#
#   jobs:
#     test:
#       uses: LegionForge/dev-rig/.github/workflows/node-test.yml@main
#       with:
#         coverage-threshold: 80

name: Tests & Coverage (Node)

permissions:
  contents: read

concurrency:
  group: dev-rig-node-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      test-script:
        description: "npm script to run (must emit coverage)"
        required: false
        type: string
        default: "test:coverage"
      coverage-threshold:
        description: "Minimum coverage % — passed to runner via COVERAGE_THRESHOLD env var"
        required: false
        type: number
        default: 80

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          [[ "$TEST_SCRIPT" =~ ^[A-Za-z0-9:_-]+$ ]] || { echo "Invalid test script"; exit 2; }
          [[ "$COVERAGE_THRESHOLD" =~ ^[0-9]+$ ]] || { echo "Invalid coverage threshold"; exit 2; }
          npm run "$TEST_SCRIPT"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-node
          path: |
            coverage/
            coverage.xml
          retention-days: 90
