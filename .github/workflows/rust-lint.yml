# Reusable workflow: cargo fmt --check + clippy
# Caller syntax:
#
#   jobs:
#     lint:
#       uses: LegionForge/dev-rig/.github/workflows/rust-lint.yml@main

name: Rust Lint

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust toolchain version (stable, nightly, or specific like 1.78)"
        required: false
        type: string
        default: "stable"

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
