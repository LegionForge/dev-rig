# Reusable workflow: lint + type check
# Caller syntax:
#
#   jobs:
#     lint:
#       uses: LegionForge/dev-rig/.github/workflows/lint.yml@main
#       with:
#         source-dirs: "my_package svcmgr"
#         python-version: "3.11"          # optional, defaults to 3.11

name: Lint & Type Check

permissions:
  contents: read

concurrency:
  group: dev-rig-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      source-dirs:
        description: "Space-separated source directories to analyse"
        required: true
        type: string
      test-dirs:
        description: "Space-separated test directories to analyse"
        required: false
        type: string
        default: ""
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
      extra-mypy-deps:
        description: "Space-separated extra packages for mypy stubs"
        required: false
        type: string
        default: "types-PyYAML"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dev dependencies
        # `uv sync` resolves against this repo's own uv.lock when one is
        # committed, so CI installs exactly what was locked/tested locally
        # instead of silently picking up whatever is newest on PyPI. Repos
        # without a committed lock still resolve fresh, same as before.
        run: uv sync --extra dev

      - name: Install extra mypy stub packages
        env:
          EXTRA_MYPY_DEPS: ${{ inputs.extra-mypy-deps }}
        if: ${{ inputs.extra-mypy-deps != '' }}
        run: |
          read -r -a deps <<< "$EXTRA_MYPY_DEPS"
          uv pip install "${deps[@]}"

      - name: Ruff
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
          TEST_DIRS: ${{ inputs.test-dirs }}
        run: |
          read -r -a source_dirs <<< "$SOURCE_DIRS"
          read -r -a test_dirs <<< "$TEST_DIRS"
          uv run ruff check "${source_dirs[@]}" "${test_dirs[@]}"

      - name: Bandit
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          read -r -a source_dirs <<< "$SOURCE_DIRS"
          uv run bandit -r "${source_dirs[@]}" -c pyproject.toml

      - name: mypy
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          read -r -a source_dirs <<< "$SOURCE_DIRS"
          uv run mypy "${source_dirs[@]}"
