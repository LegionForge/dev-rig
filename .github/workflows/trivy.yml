# Reusable workflow: Trivy filesystem vulnerability, misconfiguration, and secret scan.

name: Trivy Security Scan

permissions:
  contents: read

concurrency:
  group: dev-rig-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      severity:
        description: "Comma-separated severity levels"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      exit-code:
        description: "Exit code when findings are detected"
        required: false
        type: string
        default: "1"
      image:
        description: "Optional built image to scan after filesystem scan"
        required: false
        type: string
        default: ""

jobs:
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required only to publish the Trivy SARIF report.
      security-events: write # zizmor: ignore[undocumented-permissions] — uploads Trivy SARIF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          scanners: vuln,misconfig,secret

      - name: Scan built container image
        if: inputs.image != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}
          format: table
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          scanners: vuln,misconfig,secret

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30
