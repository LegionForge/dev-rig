# Reusable workflow: cargo test
# Caller syntax:
#
#   jobs:
#     test:
#       uses: LegionForge/dev-rig/.github/workflows/rust-test.yml@main

name: Rust Tests

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust toolchain version"
        required: false
        type: string
        default: "stable"

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features --workspace
