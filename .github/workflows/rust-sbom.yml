name: SBOM (Rust)

on:
  workflow_call:
    inputs:
      rust-version:
        type: string
        required: false
        default: stable

permissions: {contents: read}

concurrency:
  group: dev-rig-rust-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: ${{ inputs.rust-version }}
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-cyclonedx-rust
          path: "*.cdx.json"
          if-no-files-found: error
          retention-days: 30
