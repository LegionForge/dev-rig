# Reusable workflow: semgrep + CodeQL
# Caller syntax:
#
#   jobs:
#     sast:
#       uses: LegionForge/dev-rig/.github/workflows/sast.yml@main
#       with:
#         source-dirs: "my_package/"
#       permissions:
#         security-events: write

name: SAST

permissions:
  contents: read

concurrency:
  group: dev-rig-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      source-dirs:
        description: "Space-separated source directories for semgrep"
        required: true
        type: string
      semgrep-configs:
        description: "Space-separated semgrep config targets"
        required: false
        type: string
        default: "p/python p/fastapi"
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep scan
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          configs=""
          read -r -a config_names <<< "$SEMGREP_CONFIGS"
          for c in "${config_names[@]}"; do
            [[ "$c" =~ ^p/[A-Za-z0-9_-]+$ ]] || { echo "Invalid Semgrep config: $c"; exit 2; }
            configs="$configs --config=$c"
          done
          read -r -a source_dirs <<< "$SOURCE_DIRS"
          # shellcheck disable=SC2086
          semgrep $configs "${source_dirs[@]}" --error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for CodeQL SARIF upload and alert deduplication.
      security-events: write # zizmor: ignore[undocumented-permissions] — uploads CodeQL SARIF
      # Required by CodeQL's workflow-run API integration.
      actions: read # zizmor: ignore[undocumented-permissions] — CodeQL workflow-run API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3
