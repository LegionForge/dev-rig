# Reusable workflow: pytest with coverage
# Caller syntax:
#
#   jobs:
#     test:
#       uses: LegionForge/dev-rig/.github/workflows/test.yml@main
#       with:
#         coverage-source: "my_package"
#         coverage-threshold: 80

name: Tests & Coverage

permissions:
  contents: read

concurrency:
  group: dev-rig-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      coverage-source:
        description: "Package to measure coverage against"
        required: true
        type: string
      coverage-threshold:
        description: "Minimum coverage percentage (fail below this)"
        required: false
        type: number
        default: 80
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
      extra-deps:
        description: "Space-separated extra packages to install"
        required: false
        type: string
        default: "types-PyYAML"

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dev dependencies
        env:
          EXTRA_DEPS: ${{ inputs.extra-deps }}
        run: |
          read -r -a deps <<< "$EXTRA_DEPS"
          python -m pip install -e ".[dev]" "${deps[@]}"

      - name: pytest with coverage
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          [[ "$COVERAGE_SOURCE" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "Invalid coverage source"; exit 2; }
          [[ "$COVERAGE_THRESHOLD" =~ ^[0-9]+$ ]] || { echo "Invalid coverage threshold"; exit 2; }
          python -m pytest \
            --cov="$COVERAGE_SOURCE" \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="$COVERAGE_THRESHOLD"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
