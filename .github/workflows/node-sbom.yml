# Reusable workflow: SBOM generation — CycloneDX JSON (Node/TypeScript)
# (OWASP SAMM — Implementation/Secure Build)
#
# Produces a CycloneDX JSON SBOM from npm dependencies and uploads it
# as a build artifact retained for 90 days.
#
# Caller syntax:
#
#   jobs:
#     sbom:
#       uses: LegionForge/dev-rig/.github/workflows/node-sbom.yml@main

name: SBOM (Node)

permissions:
  contents: read

concurrency:
  group: dev-rig-node-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format json \
            --output-file sbom.json
          echo "=== SBOM summary ==="
          node -e "
            const d = require('./sbom.json');
            const c = d.components || [];
            console.log(c.length + ' components');
            c.slice(0, 10).forEach(x => console.log('  ' + x.name + ' ' + (x.version || '?')));
            if (c.length > 10) console.log('  ... and ' + (c.length - 10) + ' more');
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-cyclonedx-node
          path: sbom.json
          retention-days: 90
