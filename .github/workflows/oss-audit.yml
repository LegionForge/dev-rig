name: OSS Risk Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dev-rig-oss-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-controls:
    name: Static CI/CD Controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install audit tool
        run: python -m pip install -e ".[analysis]"
      - name: Run static control audit
        shell: bash
        run: |
          set -o pipefail
          python -m legionforge_dev_rig.oss_risk_audit . --strict --json | tee oss-risk-audit.json
      - name: Run zizmor high-severity gate
        run: zizmor .github/workflows --pedantic --min-severity high
      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: oss-risk-audit
          path: oss-risk-audit.json
          if-no-files-found: error
          retention-days: 30
