# Reusable workflow: dependency CVE scan + license compliance (Node/TypeScript)
#
# npm audit: flags known CVEs at or above the specified severity level.
# license-checker: fails if any dependency uses a license not in the allowlist.
#
# Caller syntax:
#
#   jobs:
#     audit:
#       uses: LegionForge/dev-rig/.github/workflows/node-audit.yml@main
#       with:
#         audit-level: "high"

name: Dependency Audit (Node)

permissions:
  contents: read

concurrency:
  group: dev-rig-node-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      audit-level:
        description: "Minimum severity to fail on (critical, high, moderate, low)"
        required: false
        type: string
        default: "high"
      license-allowlist:
        description: "Semicolon-separated SPDX license IDs to permit"
        required: false
        type: string
        default: "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;BlueOak-1.0.0;Python-2.0"

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (CVE scan)
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          [[ "$AUDIT_LEVEL" =~ ^(critical|high|moderate|low|info)$ ]] || { echo "Invalid audit level"; exit 2; }
          npm audit --audit-level="$AUDIT_LEVEL"

      - name: License compliance
        env:
          LICENSE_ALLOWLIST: ${{ inputs.license-allowlist }}
        run: |
          [[ "$LICENSE_ALLOWLIST" =~ ^[A-Za-z0-9_.+;-]+$ ]] || { echo "Invalid license allowlist"; exit 2; }
          npx license-checker \
            --onlyAllow "$LICENSE_ALLOWLIST" \
            --excludePrivatePackages \
            --summary
