# Reusable workflow: SAST — semgrep + CodeQL (Node/TypeScript)
#
# semgrep: scans JS/TS source with p/javascript, p/typescript, p/nodejs rulesets.
# CodeQL:  GitHub's semantic analysis engine with security-extended queries.
#
# Caller syntax:
#
#   jobs:
#     sast:
#       uses: LegionForge/dev-rig/.github/workflows/node-sast.yml@main
#       with:
#         source-dirs: "src"
#       permissions:
#         contents: read
#         security-events: write
#         actions: read       # required by the nested codeql job

name: SAST (Node)

permissions:
  contents: read

concurrency:
  group: dev-rig-node-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      source-dirs:
        description: "Space-separated source directories for semgrep"
        required: false
        type: string
        default: "src"
      semgrep-configs:
        description: "Space-separated semgrep config targets"
        required: false
        type: string
        default: "p/javascript p/typescript p/nodejs"

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # semgrep is a Python tool — install via pip on a fixed Python version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep scan
        env:
          SEMGREP_CONFIGS: ${{ inputs.semgrep-configs }}
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          configs=""
          read -r -a config_names <<< "$SEMGREP_CONFIGS"
          for c in "${config_names[@]}"; do
            [[ "$c" =~ ^p/[A-Za-z0-9_-]+$ ]] || { echo "Invalid Semgrep config"; exit 2; }
            configs="$configs --config=$c"
          done
          read -r -a source_dirs <<< "$SOURCE_DIRS"
          # shellcheck disable=SC2086
          semgrep $configs "${source_dirs[@]}" --error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for CodeQL SARIF upload.
      security-events: write # zizmor: ignore[undocumented-permissions] — uploads CodeQL SARIF
      # Required by CodeQL's workflow-run API integration.
      actions: read # zizmor: ignore[undocumented-permissions] — CodeQL workflow-run API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e  # v4
        with:
          # `actions` analyzes the workflow YAML itself (e.g. script-injection
          # via untrusted inputs) -- distinct from source analysis, and from
          # what oss_risk_audit.py / zizmor check via regex heuristics. The
          # org's CodeQL default setup covered this before it was disabled in
          # favor of this advanced config; keep the coverage.
          languages: javascript-typescript, actions
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c7eb380a2dc368f2d129e4c65e51d172983a1e  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
