# Reusable workflow: lint + type check (Node/TypeScript)
#
# Expects the calling project to have in devDependencies:
#   - typescript          → tsc --noEmit (always runs)
#   - eslint              → skipped gracefully if no config file present
#   - @typescript-eslint/eslint-plugin + @typescript-eslint/parser (if using TS rules)
#
# Standard LegionForge npm scripts expected:
#   "typecheck": "tsc --noEmit"
#   "lint":      "eslint <source-dirs>"   (optional — add when ready)
#
# Caller syntax:
#
#   jobs:
#     lint:
#       uses: LegionForge/dev-rig/.github/workflows/node-lint.yml@main
#       with:
#         source-dirs: "src"

name: Lint & Type Check (Node)

permissions:
  contents: read

concurrency:
  group: dev-rig-node-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      source-dirs:
        description: "Space-separated source directories for eslint"
        required: false
        type: string
        default: "src"
      typecheck-script:
        description: "npm script name for TypeScript type checking"
        required: false
        type: string
        default: "typecheck"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        env:
          TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
        run: |
          [[ "$TYPECHECK_SCRIPT" =~ ^[A-Za-z0-9:_-]+$ ]] || { echo "Invalid typecheck script"; exit 2; }
          npm run "$TYPECHECK_SCRIPT"

      - name: ESLint
        # Skip gracefully if eslint is not configured in this project
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.cjs ] || \
             [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yml ]; then
            read -r -a source_dirs <<< "$SOURCE_DIRS"
            npx eslint "${source_dirs[@]}"
          else
            echo "No ESLint config found — skipping. Add eslint.config.js to enable linting."
          fi
