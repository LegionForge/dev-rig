# Reusable workflow: SBOM generation (OWASP SAMM — Implementation/Secure Build)
# Produces a CycloneDX JSON SBOM and uploads it as a build artifact.
# Caller syntax:
#
#   jobs:
#     sbom:
#       uses: LegionForge/dev-rig/.github/workflows/sbom.yml@main
#       with:
#         python-version: "3.11"   # optional

name: SBOM

permissions:
  contents: read

concurrency:
  group: dev-rig-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install project (runtime deps)
        run: pip install -e "."

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format json > sbom.json
          echo "=== SBOM summary ==="
          python -c "
          import json, sys
          data = json.load(open('sbom.json'))
          comps = data.get('components', [])
          print(f'{len(comps)} components')
          for c in comps[:10]:
              print(f'  {c[\"name\"]}=={c.get(\"version\",\"?\")}')
          if len(comps) > 10:
              print(f'  ... and {len(comps)-10} more')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
