# Reusable workflow: SBOM generation (OWASP SAMM — Implementation/Secure Build)
# Produces a CycloneDX JSON SBOM and uploads it as a build artifact.
# Caller syntax:
#
#   jobs:
#     sbom:
#       uses: LegionForge/dev-rig/.github/workflows/sbom.yml@main
#       with:
#         python-version: "3.11"   # optional

name: SBOM

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install project (runtime deps)
        run: pip install -e "."

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format json > sbom.json
          echo "=== SBOM summary ==="
          python -c "
          import json, sys
          data = json.load(open('sbom.json'))
          comps = data.get('components', [])
          print(f'{len(comps)} components')
          for c in comps[:10]:
              print(f'  {c[\"name\"]}=={c.get(\"version\",\"?\")}')
          if len(comps) > 10:
              print(f'  ... and {len(comps)-10} more')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
