# Reusable workflow: gitleaks secret scanning (language-agnostic)
# Runs gitleaks CLI directly — avoids the license requirement added in gitleaks-action@v2.
#
# Caller syntax:
#
#   jobs:
#     secrets:
#       uses: LegionForge/dev-rig/.github/workflows/common/secrets.yml@main

name: Secret Scanning

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks CLI version to install"
        required: false
        type: string
        default: "8.24.0"

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history — gitleaks scans all commits, not just HEAD

      - name: Install gitleaks
        run: |
          VERSION="${{ inputs.gitleaks-version }}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan
        run: gitleaks detect --source . --log-opts="HEAD" --verbose
