# Reusable workflow: pip-audit dependency CVE scan
# Caller syntax:
#
#   jobs:
#     audit:
#       uses: LegionForge/dev-rig/.github/workflows/audit.yml@main
#       with:
#         ignore-vulns: "CVE-2026-1234 CVE-2026-5678"   # optional

name: Dependency Audit

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
      ignore-vulns:
        description: "Space-separated CVE IDs to suppress (e.g. CVE-2026-1234)"
        required: false
        type: string
        default: ""

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install project (runtime deps only — keep audit clean)
        run: pip install -e "."

      - name: pip-audit (CVE scan)
        run: |
          pip install pip-audit
          IGNORE_FLAGS=""
          for vuln in ${{ inputs.ignore-vulns }}; do
            IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $vuln"
          done
          python -m pip_audit $IGNORE_FLAGS

      - name: pip-licenses (license compliance — OWASP SAMM Operations)
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --with-urls --order=license --fail-on="GPL;AGPL"
