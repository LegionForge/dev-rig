# Reusable workflow: pip-audit dependency CVE scan
# Caller syntax:
#
#   jobs:
#     audit:
#       uses: LegionForge/dev-rig/.github/workflows/audit.yml@main
#       with:
#         ignore-vulns: "CVE-2026-1234 CVE-2026-5678"   # optional

name: Dependency Audit

permissions:
  contents: read

concurrency:
  group: dev-rig-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
      ignore-vulns:
        description: "Space-separated CVE IDs to suppress (e.g. CVE-2026-1234)"
        required: false
        type: string
        default: ""

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install project (runtime deps only — keep audit clean)
        run: pip install -e "."

      - name: pip-audit (CVE scan)
        env:
          IGNORE_VULNS: ${{ inputs.ignore-vulns }}
        run: |
          python -m pip install "pip>=26.1.2" "setuptools>=83.0.0" pip-audit
          IGNORE_FLAGS=""
          read -r -a VULNS <<< "$IGNORE_VULNS"
          for vuln in "${VULNS[@]}"; do
            [[ "$vuln" =~ ^(CVE|GHSA|PYSEC)-[A-Za-z0-9._-]+$ ]] || { echo "Invalid advisory ID: $vuln"; exit 2; }
            IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $vuln"
          done
          # shellcheck disable=SC2086
          python -m pip_audit --skip-editable $IGNORE_FLAGS

      - name: pip-licenses (license compliance — OWASP SAMM Operations)
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --with-urls --order=license --fail-on="GPL;AGPL"
