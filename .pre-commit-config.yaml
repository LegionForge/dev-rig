# Default pre-commit config for LegionForge projects.
# Copy to your project root and adjust source-dirs / mypy args as needed.
#
# First-time setup:
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files

repos:
  # ── Standard file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── Ruff — lint + import sort + format ────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Bandit — security SAST ─────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # ── mypy — type checking ───────────────────────────────────────────────────
  # Adjust additional_dependencies to match project's runtime deps.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - pyyaml
          - fastapi
          - httpx
          - psutil
          - uvicorn

  # ── shellcheck — shell script correctness + footguns ──────────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # ── osv-scanner — dependency vuln + malicious-package scan (multi-ecosystem)─
  # Local hook (uses the installed osv-scanner binary). Triggers only when a
  # lockfile changes; scans the whole tree so cross-ecosystem repos are covered.
  - repo: local
    hooks:
      - id: osv-scanner
        name: osv-scanner (deps + malicious packages)
        entry: osv-scanner scan source --recursive --allow-no-lockfiles .
        language: system
        pass_filenames: false
        files: '(requirements.*\.txt|poetry\.lock|uv\.lock|Pipfile\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|go\.sum)$'

  # ── gitleaks — secret scanning (OWASP SAMM — Implementation/Secure Build) ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
